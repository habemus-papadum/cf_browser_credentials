name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # ship reads each package's release tags

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (frozen lockfile — also the lockfile-drift guard)
        run: pnpm install --frozen-lockfile

      - name: Install ship
        run: uv sync --locked

      - name: Release policy (versions, tags, peer ranges, lockfiles, skill copies)
        run: uv run ship deps check

      - name: Build all packages
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint & format check (Biome)
        run: pnpm run lint

      - name: Test
        run: pnpm run test
