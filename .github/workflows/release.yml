# The only publish path. ship releases one package per run: it computes the version
# from the package's last tag, builds, tests, publishes to npm, tags
# <package>-v<version>, pushes, and returns the manifest to <version>+dev.
# Run from the Actions UI or:
#   gh workflow run release.yml -f package=@habemus-papadum/cf-creds-aws -f bump=minor -f dry_run=false
name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (its npm name)
        type: string
        required: true
      bump:
        description: patch, minor or major, applied to the package's last release tag
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Plan and print; write nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    uses: habemus-papadum/pdum_ship/.github/workflows/release.yml@main
    with:
      package: ${{ inputs.package }}
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}
      node_version: "24"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      actions: read
