# ship-check rejects a commit with a link:/file: dependency, a path/editable uv source,
# a stale lockfile or a stale skill copy. It runs the ship this repository installs
# through uv.lock, so nothing here changes when ship releases. Install once with
# `uvx pre-commit install`; CI runs the same check through `ship deps check`.
repos:
  - repo: local
    hooks:
      - id: ship-check
        name: ship deps check (development links, lockfiles, skill copies)
        entry: uv run --locked ship deps check --hook
        language: system
        pass_filenames: false
        always_run: true
